[project]
name = "refrain-gateway"
version = "0.0.0"
description = "Snapshot-keyed data gateway for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlglot==30.24.0",  # pinned: part of the cache key (spec 001)
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "refrain"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
