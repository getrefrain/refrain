name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Spec vectors are valid JSON
        run: shopt -s nullglob; for f in specs/*/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Every tasks.md has test tasks (Constitution Article I)
        run: |
          shopt -s nullglob; fail=0
          for f in specs/*/tasks.md; do
            grep -Eq '^- \[[ xX]\] .*tests/' "$f" || { echo "::error file=$f::no test tasks (tasks touching tests/)"; fail=1; }
          done
          exit $fail
      - name: Agent scope hook
        run: uv run pytest .claude/hooks -q
      - name: Tests
        # Exit 5 = no tests collected yet; remove once spec 001 tests land.
        run: uv run pytest || [ $? -eq 5 ]
