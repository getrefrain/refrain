version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # sqlglot's exact version is part of spec 001's cache key, so it is bumped only through a spec revision.
    ignore:
      - dependency-name: sqlglot
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
